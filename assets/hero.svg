<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Reniel Galang — Software Engineering and AI Integration</title>
  <desc id="hero-description">Hello, I'm Reniel Galang. I turn complex business challenges into secure, customizable, and easy-to-use software solutions tailored to your needs. Full Stack. AI Specialist. Custom Solutions. Currently building Yumi (YourAI), a Conversational AI Receptionist for airports, hotels, events, barangay health centers, and more. Streamline ID verification. Customizable Kiosk. Faster General Inquiries.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101e"/>
      <stop offset=".55" stop-color="#0b1b2b"/>
      <stop offset="1" stop-color="#071321"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cebc9"/>
      <stop offset="1" stop-color="#69bdf7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9ab9cc" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="mint-glow">
      <stop offset="0" stop-color="#35c8ac" stop-opacity=".12"/>
      <stop offset="1" stop-color="#35c8ac" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow">
      <stop offset="0" stop-color="#448add" stop-opacity=".12"/>
      <stop offset="1" stop-color="#448add" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#background)"/>
  <rect width="1200" height="480" rx="28" fill="url(#grid)"/>
  <ellipse cx="1030" cy="140" rx="250" ry="140" fill="url(#mint-glow)"/>
  <ellipse cx="190" cy="365" rx="190" ry="115" fill="url(#blue-glow)"/>

  <!-- Identity, role, value, and capabilities share one left alignment. -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="76" fill="url(#accent)" font-size="22" font-weight="700">Hello, I'm</text>
    <text x="48" y="140" fill="url(#accent)" font-size="66" font-weight="800" letter-spacing="-2.6">RENIEL GALANG</text>
    <text x="48" y="188" fill="url(#accent)" font-size="22" font-weight="700" letter-spacing=".7">SOFTWARE ENGINEERING + AI INTEGRATION</text>

    <text x="48" y="242" fill="url(#accent)" font-size="22">
      <tspan x="48" textLength="600" lengthAdjust="spacing">I turn complex business challenges into secure, customizable,</tspan>
      <tspan x="48" dy="34">and easy-to-use software solutions tailored to your needs.</tspan>
    </text>

    <g fill="#132d3c" stroke="#315566">
      <rect x="48" y="320" width="172" height="40" rx="20"/>
      <rect x="232" y="320" width="184" height="40" rx="20"/>
      <rect x="428" y="320" width="220" height="40" rx="20"/>
    </g>
    <g fill="url(#accent)" font-size="16" font-weight="700" text-anchor="middle">
      <text x="134" y="346">Full Stack</text>
      <text x="324" y="346">AI Specialist</text>
      <text x="538" y="346">Custom Solutions</text>
    </g>
  </g>

  <!-- Project identity, capabilities, intended settings, and purpose. -->
  <rect x="720" y="36" width="432" height="408" rx="20" fill="#0d1d2c" stroke="#315566" stroke-width="1.5"/>
  <path d="M740 36H1132Q1152 36 1152 56V80H720V56Q720 36 740 36Z" fill="#142b3a"/>
  <path d="M720 80H1152" stroke="#294858"/>
  <circle cx="744" cy="58" r="5" fill="#7cebc9"/>
  <text x="760" y="63" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURRENTLY BUILDING</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="752" y="132" fill="url(#accent)" font-size="38" font-weight="800" letter-spacing="-.6">Yumi (YourAI)</text>
    <text x="752" y="166" fill="url(#accent)" font-size="18">Conversational AI Receptionist</text>

    <g fill="#132d3c" stroke="#315566">
      <rect x="752" y="198" width="114" height="34" rx="17"/>
      <rect x="878" y="198" width="110" height="34" rx="17"/>
      <rect x="1000" y="198" width="120" height="34" rx="17"/>
      <rect x="752" y="244" width="236" height="34" rx="17"/>
      <rect x="1000" y="244" width="120" height="34" rx="17"/>
    </g>
    <g fill="url(#accent)" font-size="14" font-weight="700" text-anchor="middle">
      <text x="809" y="220">Airports</text>
      <text x="933" y="220">Hotels</text>
      <text x="1060" y="220">Events</text>
      <text x="870" y="266">Barangay Health Centers</text>
      <text x="1060" y="266">And More</text>
    </g>

    <path d="M752 298H1120" stroke="#294858"/>
    <g fill="none" stroke="#7cebc9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M753 321l5 5 10-12"/>
      <path d="M753 357l5 5 10-12"/>
      <path d="M753 393l5 5 10-12"/>
    </g>
    <g fill="url(#accent)" font-size="18">
      <text x="784" y="326">Streamline ID verification</text>
      <text x="784" y="362">Customizable Kiosk</text>
      <text x="784" y="398">Faster General Inquiries</text>
    </g>
  </g>
</svg>
