    <path d="M815 376v9m7 0v-9m0 4q0-5 5-4 3 0 3 4v5"/>
    <circle cx="815" cy="371" r="1"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="url(#accent)">
    <text x="92" y="386" font-size="22">renielgalang.py@gmail.com</text>
    <text x="500" y="386" font-size="22">(+63) 992-515-2549</text>
    <text x="852" y="386" font-size="22">in/reniel-galang-tech-engr</text>
  </g>
</svg>
