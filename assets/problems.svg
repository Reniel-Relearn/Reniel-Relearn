<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 696" role="img" aria-labelledby="problems-title problems-description">
  <title id="problems-title">Engineering problems and results</title>
  <desc id="problems-description">Four visual case studies. Yumi: observed prototype response time improved from 8–10 seconds to 2–4 seconds. AI Bartender: video, audio, and order conflicts fixed and verified in the prototype. KPI chatbot and receptionist: knowledge-base-grounded answers with deterministic identity, authorization, and database checks, tested in prototype workflows. CalorieCheck: layered security controls applied using Cloudflare Turnstile, authentication, database Row Level Security, and Vercel WAF rules.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101e"/><stop offset=".55" stop-color="#0b1b2b"/><stop offset="1" stop-color="#071321"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cebc9"/><stop offset="1" stop-color="#69bdf7"/>
    </linearGradient>
    <g id="check">
      <circle r="12" fill="#163a3e" stroke="#377a75" stroke-width="1"/>
      <path d="m-5 0 3 4 7-8" fill="none" stroke="#7cebc9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="arrow" fill="none" stroke="#69bdf7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0h34m-8-7 8 7-8 7"/>
    </g>
  </defs>
  <rect x="1" y="1" width="1198" height="694" rx="28" fill="url(#background)" stroke="#315566" stroke-width="1.5"/>
  <path d="M29 1H1171Q1199 1 1199 29V64H1V29Q1 1 29 1Z" fill="#142b3a"/>
  <path d="M1 64H1199" stroke="#315566"/>
  <circle cx="32" cy="33" r="6" fill="#7cebc9"/>
  <circle cx="54" cy="33" r="6" fill="#69bdf7"/>
  <circle cx="76" cy="33" r="6" fill="#315566"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="104" y="38" fill="url(#accent)" font-size="14" font-weight="700" letter-spacing="1.2">ENGINEERING CASE STUDIES</text>
    <text x="1168" y="38" fill="#a6c2d2" font-size="12" text-anchor="end" letter-spacing="1">PROBLEMS → RESULTS</text>

    <g transform="translate(32 88)">
      <rect width="556" height="276" rx="18" fill="#0d1d2c" stroke="#315566"/>
      <text x="24" y="29" fill="#7cebc9" font-size="12" font-weight="700" letter-spacing="1.2">01 / YUMI</text>
      <text x="24" y="62" fill="url(#accent)" font-size="23" font-weight="700">Slow Voice Responses</text>
      <g fill="none" stroke="#7cebc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="80" cy="143" r="30"/>
        <path d="M80 113v-12m-9 0h18m17 21 7-7M80 125v18l14 9"/>
      </g>
      <text x="138" y="156" fill="#b9ccdc" font-size="38" font-weight="700">8–10s</text>
      <use href="#arrow" transform="translate(287 144)"/>
      <text x="348" y="156" fill="url(#accent)" font-size="44" font-weight="700">2–4s</text>
      <path d="M24 202H532" stroke="#294858"/>
      <text x="24" y="235" fill="url(#accent)" font-size="22" font-weight="700">Faster Voice Responses</text>
      <text x="24" y="258" fill="#a6c2d2" font-size="13">Observed in prototype tests</text>
    </g>

    <g transform="translate(612 88)">
      <rect width="556" height="276" rx="18" fill="#0d1d2c" stroke="#315566"/>
      <text x="24" y="29" fill="#7cebc9" font-size="12" font-weight="700" letter-spacing="1.2">02 / AI BARTENDER</text>
      <text x="24" y="62" fill="url(#accent)" font-size="23" font-weight="700">Playback &amp; Order Conflicts</text>
      <g fill="none" stroke="#69bdf7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="57" y="112" width="76" height="52" rx="8"/>
        <path d="m87 126 20 12-20 12Z"/>
        <path d="m254 122-17 13h-12v22h12l17 13ZM268 133q12 13 0 26m10-37q24 24 0 48"/>
        <path d="m396 115 31 35 31-35Zm31 35v25m-16 0h32m-38-60 9-13h16"/>
      </g>
      <use href="#check" transform="translate(134 164)"/>
      <use href="#check" transform="translate(285 164)"/>
      <use href="#check" transform="translate(459 164)"/>
      <g fill="#a6c2d2" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
        <text x="95" y="188">VIDEO</text><text x="255" y="188">AUDIO</text><text x="427" y="188">ORDERS</text>
      </g>
      <path d="M24 202H532" stroke="#294858"/>
      <text x="24" y="235" fill="url(#accent)" font-size="22" font-weight="700">Playback &amp; Order Conflicts Fixed</text>
      <text x="24" y="258" fill="#a6c2d2" font-size="13">Fixes verified in prototype</text>
    </g>

    <g transform="translate(32 388)">
      <rect width="556" height="276" rx="18" fill="#0d1d2c" stroke="#315566"/>
      <text x="24" y="29" fill="#7cebc9" font-size="12" font-weight="700" letter-spacing="1.2">03 / KPI CHATBOT + RECEPTIONIST</text>
      <text x="24" y="62" fill="url(#accent)" font-size="23" font-weight="700">Knowledge &amp; Access Boundaries</text>
      <g fill="none" stroke="#69bdf7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="104" cy="118" rx="29" ry="10"/>
        <path d="M75 118v39c0 14 58 14 58 0v-39m-58 19c0 14 58 14 58 0"/>
        <path d="m275 107 29 11v23c0 18-15 29-29 35-14-6-29-17-29-35v-23Zm-12 33 8 8 17-19"/>
        <rect x="411" y="113" width="62" height="52" rx="7"/>
        <circle cx="429" cy="131" r="6"/><path d="M419 150q10-15 20 0m8-20h15m-15 11h15"/>
      </g>
      <use href="#arrow" transform="translate(168 141)"/>
      <use href="#arrow" transform="translate(341 141)"/>
      <g fill="#a6c2d2" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".6">
        <text x="104" y="190">KNOWLEDGE BASE</text><text x="275" y="190">ACCESS RULES</text><text x="442" y="190">ID CHECKS</text>
      </g>
      <path d="M24 202H532" stroke="#294858"/>
      <text x="24" y="235" fill="url(#accent)" font-size="22" font-weight="700">Grounded Answers. Controlled Access.</text>
      <text x="24" y="258" fill="#a6c2d2" font-size="13">Prototype presented · Security workflows tested</text>
    </g>

    <g transform="translate(612 388)">
      <rect width="556" height="276" rx="18" fill="#0d1d2c" stroke="#315566"/>
      <text x="24" y="29" fill="#7cebc9" font-size="12" font-weight="700" letter-spacing="1.2">04 / CALORIECHECK</text>
      <text x="24" y="62" fill="url(#accent)" font-size="23" font-weight="700">Abuse &amp; Unauthorized Access</text>
      <g fill="none" stroke="#69bdf7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="65" y="119" width="60" height="42" rx="9"/>
        <path d="M95 119v-12m-9 0h18m-39 26h-9v15h9m60-15h9v15h-9m-46 4h19"/>
        <circle cx="82" cy="133" r="2"/><circle cx="107" cy="133" r="2"/>
        <path d="m126 144 16 6v12c0 10-8 16-16 20-8-4-16-10-16-20v-12Zm-7 17 5 5 9-10"/>
        <ellipse cx="275" cy="117" rx="29" ry="10"/>
        <path d="M246 117v39c0 14 58 14 58 0v-39m-58 19c0 14 58 14 58 0"/>
        <rect x="283" y="147" width="27" height="25" rx="4"/>
        <path d="M289 147v-6a7 7 0 0 1 14 0v6m-7 10v5"/>
        <rect x="401" y="112" width="74" height="57" rx="4"/>
        <path d="M401 131h74m-74 19h74m-50-38v19m25-19v19m-38 0v19m25-19v19m-12 0v19m25-19v19"/>
        <path d="m464 142 16 6v12c0 10-8 16-16 20-8-4-16-10-16-20v-12Zm-7 17 5 5 9-10"/>
      </g>
      <g fill="#a6c2d2" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".6">
        <text x="104" y="190">TURNSTILE</text><text x="275" y="190">AUTH + RLS</text><text x="442" y="190">WAF RULES</text>
      </g>
      <path d="M24 202H532" stroke="#294858"/>
      <text x="24" y="235" fill="url(#accent)" font-size="22" font-weight="700">Layered Security Controls Applied</text>
    </g>
  </g>
</svg>
