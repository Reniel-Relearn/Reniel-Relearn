name: Live Portfolio Status

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROFILE_PAT }}

      - name: Check portfolio health
        id: check
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://reniel-galang.lovable.app/)
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [ "$CODE" = "200" ]; then
            echo "line=🟢 Portfolio verified up · last checked ${TS}" >> "$GITHUB_OUTPUT"
            echo "emoji=:green_circle:" >> "$GITHUB_OUTPUT"
            echo "msg=Portfolio verified up · ${TS}" >> "$GITHUB_OUTPUT"
          else
            echo "line=🔴 Portfolio unreachable (HTTP ${CODE}) · last checked ${TS}" >> "$GITHUB_OUTPUT"
            echo "emoji=:red_circle:" >> "$GITHUB_OUTPUT"
            echo "msg=Portfolio check failing (HTTP ${CODE}) · ${TS}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update README status line
        env:
          LINE: ${{ steps.check.outputs.line }}
        run: |
          python3 - <<'EOF'
          import re, os
          line = os.environ["LINE"]
          with open("README.md") as f:
              content = f.read()
          content = re.sub(
              r"(<!-- LIVE-STATUS:START -->\n).*?(\n<!-- LIVE-STATUS:END -->)",
              lambda m: m.group(1) + line + m.group(2),
              content,
              flags=re.DOTALL,
          )
          with open("README.md", "w") as f:
              f.write(content)
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update live portfolio status"
          git push

      - name: Update profile status
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
          EMOJI: ${{ steps.check.outputs.emoji }}
          MSG: ${{ steps.check.outputs.msg }}
        run: |
          gh api graphql \
            -f query='mutation($emoji:String!,$msg:String!){changeUserStatus(input:{emoji:$emoji, message:$msg}){status{message}}}' \
            -f emoji="$EMOJI" \
            -f msg="$MSG"
